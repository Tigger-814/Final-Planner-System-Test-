const Programs = document.querySelectorAll(".Program");
const clamp = (val, min, max) => Math.min(Math.max(val, min), max);


const Mathematics1ScoreCriteria = {
        NAME: "Mathematics1",
        F1: 10,
        SUM: 30,
        F2: 10,
        ACTIVITY: 10,
        BEHAVIOR: 10,
        FINAL: 30,
 };

 const Thai1ScoreCriteria = {
        NAME: "Thai1",
        ["F1 (หนังสือนอกเวลา)"]: 10,
        SUM: 30,
        ["F2 (แนะนำหนังสือเล่มโปรด)"]: 10,
        ["F2 (สอบท่องบทอาขยาน)"]: 5,
        ["F2 (งานที่ครูมอบหมาย)"]: 5,
        BEHAVIOR: 10,
        FINAL: 30,
 };

 const English1ScoreCriteria = {
        NAME: "English1",
        ["F1 (Opinion Essay)"]: 10,
        SUM: 30,
        ["F2 (Master Chef TU)"]: 10,
        ["F2 (External Reading)"]: 10,
        BEHAVIOR: 10,
        FINAL: 30,
 };

const SM_M4Subjects = [Mathematics1ScoreCriteria,Thai1ScoreCriteria,English1ScoreCriteria];
const AM_M4Subjects = [Mathematics1ScoreCriteria,Thai1ScoreCriteria,English1ScoreCriteria];
const AJ_M4Subjects = [Mathematics1ScoreCriteria,Thai1ScoreCriteria,English1ScoreCriteria];
const AF_M5Subjects = [Mathematics1ScoreCriteria,Thai1ScoreCriteria,English1ScoreCriteria];
const AS_M5Subjects = [Mathematics1ScoreCriteria,Thai1ScoreCriteria,English1ScoreCriteria];
const SM_M5Subjects = [Mathematics1ScoreCriteria,Thai1ScoreCriteria,English1ScoreCriteria];

const ProgramSubjects = {
    ["SM-M4"]: SM_M4Subjects,
    ["AM-M4"]: AM_M4Subjects,
    ["AJ-M4"]: AJ_M4Subjects,
    ["AF-M5"]: AF_M5Subjects,
    ["AS-M5"]: AS_M5Subjects,
    ["SM-M5"]: SM_M5Subjects,
};



function createSubjectLists(SubjectCriteria, SubjectName) {
    //alert(ProgramID);


    let SubjectParagraph = document.createElement("div");
    SubjectParagraph.id = SubjectName
    let SubjectTextNode = document.createTextNode(SubjectName);
    SubjectParagraph.appendChild(SubjectTextNode);

    for (let [key, value] of Object.entries(SubjectCriteria)) {
        if (key == "FINAL") {
            SubjectParagraph.appendChild(document.createElement("br"));
            let CriteriaText = document.createTextNode("FINAL: " + value);
            SubjectParagraph.appendChild(CriteriaText);
        } else if (key != "NAME") {
            SubjectParagraph.appendChild(document.createElement("br"));
            let CriteriaText = document.createTextNode(key);
            let CriteriaTextBox = document.createElement("input");
            CriteriaTextBox.placeholder = value;
            CriteriaTextBox.className = SubjectName + "_CriteriaTextBox";
            CriteriaTextBox.addEventListener('change', function(event) {
                CriteriaTextBox.value = clamp(Number(CriteriaTextBox.value || 0), 0, value);
            });
            SubjectParagraph.appendChild(CriteriaText);
            SubjectParagraph.appendChild(CriteriaTextBox);
        }
    };

    SubjectParagraph.appendChild(document.createElement("br"));
    let CalculateScore = document.createElement("button");
    CalculateScore.textContent = "Calculate Score";
    SubjectParagraph.append(CalculateScore);
    SubjectParagraph.appendChild(document.createElement("br"));
    let ScoreText = document.createTextNode("Your score is: ");
    SubjectParagraph.append(ScoreText);

    CalculateScore.addEventListener("click", () => {
        let ScoreTextBoxes  = document.querySelectorAll("."+ SubjectName + "_CriteriaTextBox");
        let totalScore = 80;
        ScoreTextBoxes.forEach(input => {
            totalScore -= Number(input.value) || 0;
        });
       if (totalScore > 0 && totalScore <= SubjectCriteria.FINAL) {
             ScoreText.textContent = "Your score is: " + totalScore;
       } else {
            ScoreText.textContent = "Your score is not enough.";
       }
    });


    /*const Formative1 = document.createTextNode("Formative 1");
    const Formative1Score = document.createElement("input");
    Formative1Score.placeholder = "10"
    Mathematics1.appendChild(Formative1);
    Mathematics1.appendChild(Formative1Score);*/
    document.body.appendChild(SubjectParagraph);
};

/*const response = await fetch('./Data/SM-M4.json');

const ProgramLists = {
    ["SM-M4"]: await fetch('./Data/SM-M4.json').json(),
    ["AM-M4"]: await fetch('./Data/AM-M4.json').json(),
    ["AJ-M4"]: await fetch('./Data/AJ-M4.json').json(),
    ["AF-M5"]: await fetch('./Data/AF-M5.json').json(),
    ["AS-M5"]: await fetch('./Data/AS-M5.json').json(),
    ["SM-M5"]: await fetch('./Data/SM-M5.json').json(),
};

Programs.forEach(button => {
    button.addEventListener("click", () => {
        for (const subject of ProgramLists[button.id]) {
            createSubjectLists(subject,subject.NAME);
        }
    })
});
</script>
